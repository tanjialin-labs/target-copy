name: Attest release assets

on:
  release:
    types: [published]

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build release assets
        run: npm run build
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${{ github.event.release.tag_name }}" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern main.js --pattern styles.css
          cmp main.js release-assets/main.js
          cmp styles.css release-assets/styles.css
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
