name: Bug report
description: Report reproducible incorrect copy or paste behavior.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Provide a minimal reproduction with synthetic text, paths, links, and images.
        Report vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Target Copy version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and destination application
      placeholder: macOS 15, Word 2026 for macOS
    validations:
      required: true
  - type: dropdown
    id: source-view
    attributes:
      label: Source view
      options:
        - Edit
        - Live Preview
        - Reading
        - File menu or whole note
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal synthetic Markdown sample when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private note content, paths, accounts, and credentials.
          required: true
